[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tek-runtime"
version = "0.1.0"
requires-python = ">=3.10"
description = "TEK Runtime — Kaggle-side QEMU session manager."
readme = "README.md"
license = { text = "MIT" }
keywords = ["qemu", "kaggle", "virtualization"]
dependencies = []

[project.urls]
Repository = "https://github.com/ALI88708/TEK"

[tool.setuptools.packages.find]
where = ["."]
include = ["tek_runtime*"]

[tool.setuptools.package-data]
"tek_runtime" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
