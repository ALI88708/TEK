[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tek-controller"
version = "0.1.0"
description = "TEK Controller - desktop client for a temporary Kaggle environment"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tek-controller = "tek_controller.__main__:main"

[tool.setuptools.packages.find]
include = ["tek_controller*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
